{% extends 'base.html' %}

{% block content %}
    <h1>Dinner Decider</h1>
    <p class="lead">Two people, one restaurant, no arguing. Pick what you're in the mood for, swipe through what's nearby, and get the place you both said yes to.</p>

    <div class="session-options">
        <form action="{{ url_for('create_session') }}" method="post" class="option-box">
            <h2>Start</h2>
            <p class="hint">You'll get a link to send your partner.</p>
            <button type="submit">Create a session</button>
        </form>

        <form action="{{ url_for('join_session') }}" method="post" class="option-box">
            <h2>Join</h2>
            <label for="session_code" class="hint">Enter the 6-character code your partner sent.</label>
            <input type="text" id="session_code" name="session_code" placeholder="K7QM2P" maxlength="6"
                   pattern="[A-Za-z0-9]{6}" autocapitalize="characters" autocomplete="off" spellcheck="false" required>
            <button type="submit" class="secondary">Join session</button>
        </form>
    </div>
{% endblock %}
